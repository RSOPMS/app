namespace: prod

global:
  liveness:
    path: /health/live
    initialDelaySeconds: 20
    periodSeconds: 5
  readiness:
    path: /health/ready
    initialDelaySeconds: 20
    periodSeconds: 5

secrets:
  DB_PASSWORD: "password"
  JWT_SECRET: "superDuperSecret"

config:
  PORT_APP_ISSUE: "8080"
  PORT_APP_STATIC: "8081"
  PORT_APP_BULK: "8082"
  PORT_APP_INGRESS: "8083"
  PORT_APP_LOGIN: "8084"

  URL_PREFIX_ISSUE: "/prod/issue"
  URL_PREFIX_STATIC: "/prod"
  URL_PREFIX_BULK: "/prod/bulk"
  URL_PREFIX_INGRESS: "/prod/ingress"
  URL_PREFIX_LOGIN: "/prod/login"

  JWT_NAME: "bugbase_session"

  DB_NAME: "bugbase"
  DB_USER: "bugbase"
  DB_HOST: "bugbase-database-service.prod.svc"
  DB_PORT: "5432"
  DB_SSL_MODE: "disable"

  URL_NATS: "nats://nats-service:4222"

persistentVolume:
  enabled: true
  name: bugbase-database-pv-prod
  app: bugbase-database
  storage: 50Mi
  accessMode: ReadWriteMany
  storageClassName: manual
  hostPath: /data/postgresql

persistentVolumeClaims:
  - enabled: true
    name: bugbase-database-pvc-prod
    app: bugbase-database
    storage: 50Mi
    accessMode: ReadWriteMany
    storageClassName: manual
  - enabled: true
    name: grafana-pvc-prod
    app: grafana
    storageClassName: standard
    storage: 1Gi
    accessMode: ReadWriteOnce

grafana:
  pvcName: grafana-pvc-prod

services:
  bugbase-database:
    replicaCount: 1
    image:
      repository: ghcr.io/rsopms/bugbase-database
    service:
      type: ClusterIP
      port: 5432
      portName: dbport
      targetPort: 5432
    env:
      - name: DB_PASSWORD
        secretKeyRef:
          name: bugbase-secret
          key: DB_PASSWORD
      - name: JWT_SECRET
        secretKeyRef:
          name: bugbase-secret
          key: JWT_SECRET
    volumeMounts:
      - mountPath: /var/lib/postgresql/data
        name: postgresdata
    volumes:
      - name: postgresdata
        claimName: bugbase-database-pvc-prod
    livenessProbeEnabled: false
    readinessProbeEnabled: false
  prod-bugbase-issue:
    replicaCount: 1
    image:
      repository: ghcr.io/rsopms/bugbase-issue
    service:
      type: ClusterIP
      port: 8080
    env:
      - name: PORT_APP_ISSUE
        configMapKeyRef:
          name: bugbase-configmap
          key: PORT_APP_ISSUE
      - name: PORT_APP_STATIC
        configMapKeyRef:
          name: bugbase-configmap
          key: PORT_APP_STATIC
      - name: URL_PREFIX_ISSUE
        configMapKeyRef:
          name: bugbase-configmap
          key: URL_PREFIX_ISSUE
      - name: URL_PREFIX_STATIC
        configMapKeyRef:
          name: bugbase-configmap
          key: URL_PREFIX_STATIC
      - name: URL_PREFIX_LOGIN
        configMapKeyRef:
          name: bugbase-configmap
          key: URL_PREFIX_LOGIN
      - name: JWT_NAME
        configMapKeyRef:
          name: bugbase-configmap
          key: JWT_NAME
      - name: JWT_SECRET
        secretKeyRef:
          name: bugbase-secret
          key: JWT_SECRET
      - name: DB_NAME
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_NAME
      - name: DB_USER
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_USER
      - name: DB_HOST
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_HOST
      - name: DB_PORT
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_PORT
      - name: DB_SSL_MODE
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_SSL_MODE
      - name: DB_PASSWORD
        secretKeyRef:
          name: bugbase-secret
          key: DB_PASSWORD
    livenessProbeEnabled: true
    readinessProbeEnabled: true
  prod-bugbase-static:
    replicaCount: 1
    image:
      repository: ghcr.io/rsopms/bugbase-static
    service:
      type: ClusterIP
      port: 8081
    env:
      - name: PORT_APP_STATIC
        configMapKeyRef:
          name: bugbase-configmap
          key: PORT_APP_STATIC
    livenessProbeEnabled: true
    readinessProbeEnabled: true
  prod-bugbase-bulk:
    replicaCount: 1
    image:
      repository: ghcr.io/rsopms/bugbase-bulk
    service:
      type: ClusterIP
      port: 8082
    env:
      - name: PORT_APP_BULK
        configMapKeyRef:
          name: bugbase-configmap
          key: PORT_APP_BULK
      - name: URL_NATS
        configMapKeyRef:
          name: bugbase-configmap
          key: URL_NATS
    livenessProbeEnabled: true
    readinessProbeEnabled: true
  prod-bugbase-ingress:
    replicaCount: 1
    image:
      repository: ghcr.io/rsopms/bugbase-ingress
    service:
      type: ClusterIP
      port: 8083
    resources:
      limits:
        memory: 128Mi
        cpu: 500m
    env:
      - name: PORT_APP_INGRESS
        configMapKeyRef:
          name: bugbase-configmap
          key: PORT_APP_INGRESS
      - name: DB_NAME
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_NAME
      - name: DB_USER
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_USER
      - name: DB_HOST
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_HOST
      - name: DB_PORT
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_PORT
      - name: DB_SSL_MODE
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_SSL_MODE
      - name: URL_NATS
        configMapKeyRef:
          name: bugbase-configmap
          key: URL_NATS
      - name: DB_PASSWORD
        secretKeyRef:
          name: bugbase-secret
          key: DB_PASSWORD
    livenessProbeEnabled: true
    readinessProbeEnabled: true
  prod-bugbase-login:
    replicaCount: 1
    image:
      repository: ghcr.io/rsopms/bugbase-login
    service:
      type: ClusterIP
      port: 8084
    env:
      - name: PORT_APP_LOGIN
        configMapKeyRef:
          name: bugbase-configmap
          key: PORT_APP_LOGIN
      - name: URL_PREFIX_LOGIN
        configMapKeyRef:
          name: bugbase-configmap
          key: URL_PREFIX_LOGIN
      - name: URL_PREFIX_ISSUE
        configMapKeyRef:
          name: bugbase-configmap
          key: URL_PREFIX_ISSUE
      - name: JWT_NAME
        configMapKeyRef:
          name: bugbase-configmap
          key: JWT_NAME
      - name: DB_NAME
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_NAME
      - name: DB_USER
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_USER
      - name: DB_HOST
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_HOST
      - name: DB_PORT
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_PORT
      - name: DB_SSL_MODE
        configMapKeyRef:
          name: bugbase-configmap
          key: DB_SSL_MODE
      - name: DB_PASSWORD
        secretKeyRef:
          name: bugbase-secret
          key: DB_PASSWORD
      - name: JWT_SECRET
        secretKeyRef:
          name: bugbase-secret
          key: JWT_SECRET
    livenessProbeEnabled: true
    readinessProbeEnabled: true
